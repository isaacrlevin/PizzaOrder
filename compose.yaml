services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pizza_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - pizza-orders-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pizza_orders" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pizza-orders-data:
